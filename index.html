<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#718438">
  <title>牛来了，怎么化解？</title>
  <style>
    :root { --ink:#28351d; --paper:#f6e4a1; --red:#bd4b35; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:#1d280e; color:var(--ink); font-family:Arial,"Microsoft YaHei",sans-serif; }
    button { font:inherit; cursor:pointer; }
    .game { min-height:100svh; max-width:560px; margin:auto; padding:17px 16px 20px; overflow:hidden; background:linear-gradient(#82934b,#42561e 64%,#243011); }
    header { display:flex; align-items:flex-start; justify-content:space-between; color:#f8e6a8; text-shadow:1px 2px #344216; }
    header p { margin:0 0 3px; font-size:11px; font-weight:800; letter-spacing:.14em; }
    h1 { margin:0; font-family:Georgia,"Songti SC",serif; font-size:44px; line-height:.96; letter-spacing:.24em; }
    header button { border:2px solid #334218; border-radius:4px 11px 4px 9px; padding:8px 12px; color:#354014; background:#efd678; box-shadow:2px 3px #2d3c18; font-size:13px; font-weight:800; }
    .scene { height:min(62svh,600px); min-height:425px; margin-top:14px; position:relative; overflow:hidden; isolation:isolate; border:3px solid #3a4b1c; border-radius:7px 21px 8px 18px; background:#617c31 url("assets/pasture-empty.webp") center/cover no-repeat; box-shadow:inset 0 0 0 6px rgba(246,210,99,.16),4px 7px rgba(16,26,7,.56); }
    .scene::before { content:""; position:absolute; inset:-15%; z-index:0; pointer-events:none; background:radial-gradient(circle at 4% 32%,rgba(255,244,177,.62),rgba(255,244,177,0) 35%); mix-blend-mode:screen; animation:sun-drift 8s ease-in-out infinite alternate; }
    .scene::after { content:""; position:absolute; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse at 36% 36%,rgba(255,240,156,.04) 0 20%,rgba(26,36,11,.06) 52%,rgba(6,11,3,.58) 100%); mix-blend-mode:multiply; }
    @keyframes sun-drift { to { transform:translateX(9%) translateY(-2%); opacity:.72; } }
    .scene.danger { animation:alert .17s infinite alternate; }
    @keyframes alert { to { filter:saturate(1.25) contrast(1.08); } }
    .calf { position:absolute; z-index:2; left:22%; bottom:11%; width:53%; transform-origin:50% 86%; filter:drop-shadow(2px 9px 4px rgba(20,30,7,.56)); }
    .calf img { display:block; width:100%; height:auto; }
    .scene.intro .calf,.scene.watching .calf { animation:graze 1.05s ease-in-out infinite alternate; }
    .scene.danger .calf { animation:panic .115s linear infinite alternate; filter:drop-shadow(3px 10px 3px rgba(50,12,5,.64)) saturate(1.18); }
    .scene.rescue .calf { animation:hop .4s ease-out 1; }
    @keyframes graze { 0% { transform:rotate(-1deg) translateY(0); } 45% { transform:rotate(2deg) translateY(5px) scaleY(.985); } 100% { transform:rotate(-3deg) translateY(-2px); } }
    @keyframes panic { to { transform:translateX(5px) rotate(2deg); } }
    @keyframes hop { 45% { transform:translateY(-24px) rotate(-7deg); } 100% { transform:translateX(-21px) rotate(-3deg); } }
    .turf { position:absolute; z-index:1; bottom:7%; width:32px; height:54px; border-left:5px solid #526b28; border-radius:80%; transform-origin:bottom; opacity:.78; animation:grass-sway 1.9s ease-in-out infinite alternate; }
    .turf::before,.turf::after { content:""; position:absolute; bottom:0; width:4px; height:44px; border-radius:80%; background:#647e2d; transform-origin:bottom; }.turf::before { left:13px; transform:rotate(27deg); }.turf::after { left:20px; height:34px; transform:rotate(-24deg); }
    .turf-one { left:8%; }.turf-two { left:68%; bottom:10%; animation-delay:-.7s; }.turf-three { right:5%; animation-delay:-1.1s; }
    @keyframes grass-sway { to { transform:rotate(6deg) scaleY(1.06); } }
    .snake { display:none; position:absolute; z-index:3; left:-20%; bottom:14%; width:72%; animation:slither .86s steps(5,end) infinite; transform-origin:left center; filter:drop-shadow(2px 4px 1px rgba(21,32,8,.8)); }
    .scene.danger .snake { display:block; }
    .snake img { display:block; width:100%; height:auto; }
    @keyframes slither { 0% { transform:translateX(-6%) rotate(-1deg); } 50% { transform:translateX(25%) rotate(2deg); } 100% { transform:translateX(66%) rotate(-1deg); } }
    .mother { display:none; position:absolute; z-index:4; right:-8%; bottom:5%; width:66%; filter:drop-shadow(-4px 7px 3px rgba(9,17,3,.54)); }
    .mother img { display:block; width:100%; height:auto; }
    .scene.rescue .mother { display:block; animation:rush .64s cubic-bezier(.08,.88,.42,1) both; }
    @keyframes rush { from { transform:translateX(116%) rotate(7deg); } to { transform:translateX(0) rotate(0); } }
    .dust { display:none; position:absolute; z-index:3; right:27%; bottom:17%; width:76px; height:36px; border-radius:50%; background:rgba(223,204,127,.72); filter:blur(5px); }
    .scene.rescue .dust { display:block; animation:dust .62s ease-out both; }
    @keyframes dust { from { transform:scale(.2); opacity:0; } 45% { opacity:.86; } to { transform:translateX(-135px) scale(2.8); opacity:0; } }
    .impact { display:none; position:absolute; z-index:5; left:47%; top:46%; color:#fff5bd; font-family:Georgia,"Songti SC",serif; font-size:48px; font-weight:900; transform:rotate(-12deg); text-shadow:3px 3px #7e3926,-2px -2px #7e3926; }
    .scene.rescue .impact { display:block; animation:impact .66s both; }
    @keyframes impact { from { opacity:0; transform:scale(.2) rotate(-23deg); } 40% { opacity:1; transform:scale(1.25) rotate(-12deg); } to { opacity:0; transform:scale(1.5) rotate(-12deg); } }
    .bubble { position:absolute; z-index:7; left:48%; top:16%; max-width:158px; padding:9px 12px 10px; color:#344414; border:2px solid #46561c; border-radius:16px 16px 16px 3px; background:rgba(255,245,200,.93); box-shadow:2px 3px 0 rgba(24,36,8,.55); font-size:14px; font-weight:900; line-height:1.25; transform:rotate(-2deg); animation:bubble-float 1.25s ease-in-out infinite alternate; pointer-events:none; }
    .bubble::after { content:""; position:absolute; left:18px; bottom:-10px; width:15px; height:15px; border-right:2px solid #46561c; border-bottom:2px solid #46561c; background:rgba(255,245,200,.93); transform:rotate(45deg); }
    .bubble b { display:block; margin-bottom:2px; color:#a44d31; font-size:11px; letter-spacing:.1em; }
    .scene.danger .bubble { color:#873728; border-color:#913726; background:rgba(249,199,122,.96); animation:bubble-shake .14s infinite alternate; }
    .scene.danger .bubble::after { border-color:#913726; background:rgba(249,199,122,.96); }
    .scene.rescue .bubble { left:52%; top:17%; color:#61411d; border-color:#755420; background:rgba(245,221,148,.96); }
    .scene.rescue .bubble::after { border-color:#755420; background:rgba(245,221,148,.96); }
    .scene.lost .bubble { display:none; }
    @keyframes bubble-float { to { transform:translateY(-7px) rotate(1deg); } }
    @keyframes bubble-shake { to { transform:translateX(3px) rotate(1deg); } }
    .over { display:none; position:absolute; z-index:8; inset:25% 9%; align-content:center; text-align:center; padding:20px; color:#fff2c8; background:rgba(28,37,12,.86); border:3px solid #e2bb62; border-radius:19px 4px 18px 7px; box-shadow:5px 6px rgba(15,21,5,.48); }
    .scene.lost .over { display:grid; }
    .over p { margin:0 0 10px; font-family:Georgia,"Songti SC",serif; font-size:31px; font-weight:900; letter-spacing:.08em; }
    .over strong { font-size:13px; }
    .message { min-height:45px; margin:14px 0 10px; display:flex; align-items:center; padding:10px 12px; color:#3a481b; border:2px solid #40511d; border-radius:10px 3px 10px 3px; background:#f1df9e; box-shadow:2px 3px rgba(18,29,8,.45); font-size:13px; font-weight:800; }
    .message span { flex:0 0 auto; width:8px; height:8px; margin-right:8px; border-radius:50%; background:#7c9440; }
    .message.urgent { color:#883a2b; border-color:#923c2d; background:#f2c778; animation:shake .18s infinite alternate; }
    .message.urgent span { background:#c84e35; }
    @keyframes shake { to { transform:translateX(2px); } }
    .action { width:100%; padding:15px; border:3px solid #3a491b; border-radius:7px 16px 6px 13px; color:#344112; background:#e7ca67; box-shadow:3px 5px #273411; font-size:18px; font-weight:900; letter-spacing:.12em; }
    .action.urgent { color:#fff9d9; border-color:#803125; background:#bf4b34; animation:pulse .24s infinite alternate; }
    @keyframes pulse { to { transform:scale(1.024); } }
    .hint { margin:12px 0 0; color:#e7e49e; font-size:12px; text-align:center; text-shadow:1px 1px #26370e; font-weight:700; }
    @media (max-width:370px) { .game { padding-inline:11px; }.scene { min-height:400px; }.mother { width:73%; }.snake { transform:scale(.9); transform-origin:left bottom; } }
  </style>
</head>
<body>
  <main class="game">
    <header><div><p id="round">小牛吃草 · 第 1 次</p><h1>牛 来</h1></div><button id="reset">重来</button></header>
    <section class="scene intro" id="scene" aria-label="小牛吃草游戏画面">
      <div class="turf turf-one"></div><div class="turf turf-two"></div><div class="turf turf-three"></div>
      <div class="calf"><img src="assets/calf-grazing.webp" alt="正在吃草的小牛"></div>
      <div class="bubble" id="bubble"><b id="bubble-name">小牛</b><span id="bubble-text">点我开始吃草</span></div>
      <div class="snake"><img src="assets/snake-transparent.webp" alt="草地里的蛇"></div>
      <div class="mother"><img src="assets/mother-cow.webp" alt="赶来救小牛的牛妈妈"></div>
      <div class="dust"></div>
      <div class="impact">走！</div>
      <div class="over"><p>蛇 吃 到 了</p><strong>小牛没来得及喊妈妈</strong></div>
    </section>
    <section class="message" id="message" aria-live="polite"><span></span><b>小牛饿了，点一下让它吃草。</b></section>
    <button class="action" id="action">让小牛吃草</button>
    <p class="hint">蛇来得越来越快。别提前喊。</p>
  </main>
  <script>
    (function(){
      var phase="intro",score=0,timer=0;
      var scene=document.getElementById("scene"),msg=document.getElementById("message"),action=document.getElementById("action"),round=document.getElementById("round"),bubble=document.getElementById("bubble"),bubbleName=document.getElementById("bubble-name"),bubbleText=document.getElementById("bubble-text");
      function say(text,urgent){msg.className="message"+(urgent?" urgent":"");msg.querySelector("b").textContent=text}
      function draw(){
        scene.className="scene "+phase;round.textContent="小牛吃草 · 第 "+(score+1)+" 次";action.className="action"+(phase==="danger"?" urgent":"");action.textContent=phase==="intro"?"点小牛开始":phase==="danger"?"快喊妈妈！":phase==="lost"?"再来一次":"妈妈赶蛇中…";
        bubble.style.display=phase==="lost"?"none":"block";
        if(phase==="intro"){bubbleName.textContent="小牛";bubbleText.textContent="点我开始吃草"}
        else if(phase==="watching"){bubbleName.textContent="小牛";bubbleText.textContent="我在吃草……"}
        else if(phase==="danger"){bubbleName.textContent="小牛";bubbleText.textContent="妈妈！有蛇！"}
        else {bubbleName.textContent="牛妈妈";bubbleText.textContent="走开！"}
      }
      function clear(){window.clearTimeout(timer)}
      function watch(){clear();phase="watching";draw();say("小牛在吃草……别眨眼。",false);timer=window.setTimeout(function(){phase="danger";draw();say("有蛇！小牛在喊妈妈！",true);timer=window.setTimeout(function(){phase="lost";draw();say("蛇吃到了小牛。游戏结束。",true)},Math.max(540,1200-score*32))},Math.max(900,2600-score*110))}
      function reset(){clear();score=0;phase="intro";draw();say("小牛饿了，点一下让它吃草。",false)}
      action.addEventListener("click",function(){if(phase==="intro"){watch()}else if(phase==="danger"){clear();phase="rescue";draw();say("妈妈来了！蛇正在后退。",false);timer=window.setTimeout(function(){score+=1;watch()},760)}else if(phase==="watching"){say("还没有蛇。妈妈说不要乱喊。",false)}else if(phase==="lost"){reset()}});
      scene.addEventListener("click",function(){if(phase!=="watching"&&phase!=="rescue"){action.click()}});
      document.getElementById("reset").addEventListener("click",reset);draw();
    })();
  </script>
</body>
</html>
