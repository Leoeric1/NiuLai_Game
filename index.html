<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#a7d7d1">
  <title>牛来了，怎么化解？</title>
  <style>
    :root{--ink:#31473a;--cream:#f6e9bf}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#a4cfca;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}
    .game{min-height:100svh;max-width:520px;margin:auto;padding:20px 18px;overflow:hidden;position:relative;background:linear-gradient(180deg,#a7d7d1 0 58%,#799c64 58% 100%);isolation:isolate}.mist{position:absolute;width:120px;height:22px;border-radius:50%;background:rgba(241,240,197,.5);filter:blur(2px);z-index:-1}.m1{top:91px;left:-28px}.m2{top:163px;right:-50px;transform:scale(.65)}
    header{display:flex;align-items:flex-start;justify-content:space-between}header p{margin:0 0 4px;font-size:11px;font-weight:800;letter-spacing:.13em;color:#446359}h1{margin:0;font-family:Georgia,"Songti SC",serif;font-size:51px;line-height:.9;letter-spacing:.27em;color:#2e4437;text-shadow:2px 2px #d7e5bc}header button{border:2px solid #405948;border-radius:4px 13px 5px 10px;padding:8px 12px;background:#ebd799;font-size:13px;font-weight:800;color:#364b3d;box-shadow:2px 3px #61745b}
    .scene{height:min(59svh,560px);min-height:405px;margin-top:16px;position:relative;overflow:hidden;border:2px solid #435d4d;border-radius:26px 7px 24px 10px;background:linear-gradient(#b9ded3 0 54%,#94ae71 54% 100%);box-shadow:inset 0 0 0 5px rgba(245,232,177,.29),4px 6px rgba(53,76,60,.31)}.mountain{position:absolute;bottom:37%;width:115%;height:42%;background:#729168;clip-path:polygon(0 100%,12% 40%,27% 62%,42% 15%,58% 61%,73% 31%,100% 100%)}.back{left:-29%;opacity:.45;bottom:43%}.front{right:-30%;background:#6f8d63;opacity:.8}.shadow{position:absolute;bottom:12%;left:19%;height:24px;width:62%;border-radius:50%;background:rgba(47,91,46,.32);filter:blur(5px)}.grass{position:absolute;bottom:10%;font-family:Georgia,"Songti SC",serif;font-size:31px;color:#377044;font-weight:900;transform:rotate(-15deg);text-shadow:1px 2px #a4c477}.a{left:8%}.b{left:54%;bottom:15%;transform:rotate(18deg)}.c{right:4%;font-size:22px}
    .calf{position:absolute;left:31%;bottom:17%;width:156px;height:143px;transform:rotate(-2deg)}.scene.watching .calf{animation:chew .75s infinite alternate}.scene.danger .calf{animation:chew .28s infinite alternate}@keyframes chew{to{transform:rotate(2deg) translateY(3px)}}.body{position:absolute;left:21px;top:35px;width:109px;height:63px;background:#e5c988;border:3px solid #3f4e41;border-radius:49% 44% 35% 34%;box-shadow:inset -10px -7px rgba(160,119,67,.18)}.head{position:absolute;left:101px;top:20px;width:58px;height:56px;background:#f1d99d;border:3px solid #3f4e41;border-radius:39% 49% 43% 44%;transform:rotate(14deg)}.spot{position:absolute;display:block;background:#8c754a;opacity:.72}.s1{left:18px;top:13px;width:25px;height:14px;border-radius:50% 15% 42% 15%}.s2{right:18px;bottom:15px;width:18px;height:20px;border-radius:45% 20% 50% 15%}.horn{position:absolute;top:9px;width:13px;height:26px;border:3px solid #3f4e41;border-bottom:0;background:#f0e2b0;border-radius:50% 50% 0 0;z-index:2}.hl{left:113px;transform:rotate(-22deg)}.hr{left:136px;transform:rotate(24deg)}.ear{position:absolute;top:35px;width:22px;height:14px;background:#d7b877;border:3px solid #3f4e41;z-index:3}.el{left:95px;transform:rotate(20deg);border-radius:90% 30% 60% 30%}.er{left:149px;transform:rotate(-20deg);border-radius:30% 90% 30% 60%}.eye{position:absolute;width:7px;height:7px;left:35px;top:18px;border-radius:50%;background:#314238}.mouth{position:absolute;width:18px;height:9px;left:29px;bottom:9px;border-bottom:2px solid #314238;border-radius:50%}.leg{position:absolute;top:90px;width:15px;height:37px;background:#d3b574;border:3px solid #3f4e41;border-top:0;border-radius:0 0 7px 7px}.l1{left:36px}.l2{left:64px}.l3{left:98px}.l4{left:118px}
    .snake{display:none;position:absolute;left:6%;bottom:21%;width:120px;height:35px;animation:slither .84s linear infinite;transform-origin:left}.scene.danger .snake{display:block}.snake:before{content:"";position:absolute;inset:12px 17px 0 0;border:8px solid #93695b;border-left:0;border-bottom:0;border-radius:0 90% 0 0;transform:skewX(-24deg)}.snake i{position:absolute;width:8px;height:8px;background:#f1d36b;border-radius:50%;top:10px}.snake i:first-child{left:35px}.snake i:nth-child(2){left:63px}.snake b{position:absolute;right:0;top:5px;width:25px;height:18px;border-radius:50% 55% 50% 20%;background:#a97964;border:2px solid #4b4c3e}.snake b:after{content:"";position:absolute;width:14px;height:2px;right:-11px;top:12px;background:#c95449}@keyframes slither{0%{transform:translateX(-25px) rotate(-3deg)}50%{transform:translateX(40px) rotate(4deg)}100%{transform:translateX(95px) rotate(-2deg)}}
    .mother{display:none;position:absolute;right:4%;bottom:15%;width:165px;height:137px}.scene.rescue .mother{display:block;animation:rush .7s ease-out both}.mbody{position:absolute;left:25px;top:29px;width:115px;height:71px;border:4px solid #384a3d;border-radius:45% 49% 38% 34%;background:#d8c28a;box-shadow:inset -20px -10px rgba(103,87,55,.17)}.mhead{position:absolute;left:112px;top:12px;width:60px;height:61px;border:4px solid #384a3d;border-radius:48% 43% 46% 35%;background:#ebd89d;transform:rotate(14deg)}.mhead:before{content:"";position:absolute;top:-19px;left:14px;width:32px;height:26px;border:4px solid #384a3d;border-bottom:0;border-radius:50% 50% 0 0}.mleg{position:absolute;top:94px;width:17px;height:35px;background:#c6a66f;border:3px solid #384a3d;border-top:0}.ml1{left:44px}.ml2{left:71px}.ml3{left:110px}.ml4{left:132px}.mother b{position:absolute;right:-4px;top:-17px;width:32px;height:32px;display:grid;place-items:center;background:#d36250;color:#fff9df;border-radius:50%;border:2px solid #394b3d;font-family:Georgia,"Songti SC",serif}@keyframes rush{from{transform:translateX(175px)}to{transform:translateX(0)}}
    .over{display:none;position:absolute;inset:25% 10%;place-content:center;text-align:center;color:#fcf2d8;background:rgba(48,57,44,.87);border:3px solid #e9d18e;border-radius:20px 5px 19px 8px;box-shadow:5px 6px rgba(41,55,45,.45)}.scene.lost .over{display:grid}.over p{margin:0 0 11px;font-family:Georgia,"Songti SC",serif;font-size:31px;font-weight:900;letter-spacing:.08em}.over strong{font-size:13px}
    .message{min-height:44px;margin:15px 0 10px;padding:11px 12px;display:flex;align-items:center;border:1.5px solid #506a58;border-radius:11px 4px 11px 4px;background:rgba(250,243,214,.78);color:#385144;font-weight:800;font-size:13px;box-shadow:2px 3px rgba(55,79,62,.25)}.message span{width:8px;height:8px;border-radius:50%;margin-right:8px;flex:0 0 auto;background:#7d9861}.message.urgent{border-color:#9b483e;color:#8b3e36;background:#f5d69c;animation:tremble .18s infinite alternate}.message.urgent span{background:#cf513f}@keyframes tremble{to{transform:translateX(2px)}}.action{width:100%;padding:15px;border:3px solid #354b3d;border-radius:9px 18px 7px 15px;background:#e8cb82;color:#304639;font-weight:900;font-size:18px;letter-spacing:.12em;box-shadow:3px 5px #557052}.action.urgent{background:#d85e4a;color:#fff8db;border-color:#7e342e;animation:pulse .26s infinite alternate}@keyframes pulse{to{transform:scale(1.025)}}.hint{margin:12px 0 0;text-align:center;color:#edf0cc;text-shadow:1px 1px #465d49;font-size:12px;font-weight:700}@media(max-width:370px){.game{padding-inline:12px}.scene{min-height:385px}.calf{left:24%;transform:scale(.88);transform-origin:bottom left}.mother{transform:scale(.83);transform-origin:bottom right}h1{font-size:46px}}
  </style>
</head>
<body>
  <main class="game">
    <div class="mist m1"></div><div class="mist m2"></div>
    <header><div><p id="round">小牛吃草 · 第 1 次</p><h1>牛 来</h1></div><button id="reset">重来</button></header>
    <section class="scene intro" id="scene" aria-label="小牛吃草游戏画面">
      <div class="mountain back"></div><div class="mountain front"></div><div class="shadow"></div>
      <div class="grass a">草</div><div class="grass b">草</div><div class="grass c">草</div>
      <div class="calf"><span class="horn hl"></span><span class="horn hr"></span><span class="ear el"></span><span class="ear er"></span><span class="body"><i class="spot s1"></i><i class="spot s2"></i></span><span class="head"><i class="eye"></i><i class="mouth"></i></span><span class="leg l1"></span><span class="leg l2"></span><span class="leg l3"></span><span class="leg l4"></span></div>
      <div class="snake"><i></i><i></i><b></b></div>
      <div class="mother"><span class="mbody"></span><span class="mhead"></span><i class="mleg ml1"></i><i class="mleg ml2"></i><i class="mleg ml3"></i><i class="mleg ml4"></i><b>妈</b></div>
      <div class="over"><p>蛇 吃 到 了</p><strong>小牛没来得及喊妈妈</strong></div>
    </section>
    <section class="message" id="message" aria-live="polite"><span></span><b>小牛饿了，点一下让它吃草。</b></section>
    <button class="action" id="action">让小牛吃草</button>
    <p class="hint">蛇来得越来越快。别提前喊。</p>
  </main>
  <script>
    (function(){
      var phase="intro",score=0,timer=0;
      var scene=document.getElementById("scene"),msg=document.getElementById("message"),action=document.getElementById("action"),round=document.getElementById("round");
      function say(text,urgent){msg.className="message"+(urgent?" urgent":"");msg.querySelector("b").textContent=text}
      function draw(){scene.className="scene "+phase;round.textContent="小牛吃草 · 第 "+(score+1)+" 次";action.className="action"+(phase==="danger"?" urgent":"");action.textContent=phase==="intro"?"让小牛吃草":phase==="danger"?"喊 妈 妈！":phase==="lost"?"再来一次":"喊妈妈"}
      function clear(){window.clearTimeout(timer)}
      function watch(){clear();phase="watching";draw();say("小牛在吃草……别眨眼。",false);timer=window.setTimeout(function(){phase="danger";draw();say("有蛇！小牛在喊妈妈！",true);timer=window.setTimeout(function(){phase="lost";draw();say("蛇吃到了小牛。游戏结束。",true)},Math.max(540,1200-score*32))},Math.max(900,2600-score*110))}
      function reset(){clear();score=0;phase="intro";draw();say("小牛饿了，点一下让它吃草。",false)}
      action.addEventListener("click",function(){if(phase==="intro"){watch()}else if(phase==="danger"){clear();phase="rescue";draw();say("妈妈来了！蛇正在后退。",false);timer=window.setTimeout(function(){score+=1;watch()},760)}else if(phase==="watching"){say("还没有蛇。妈妈说不要乱喊。",false)}else if(phase==="lost"){reset()}});
      document.getElementById("reset").addEventListener("click",reset);draw();
    })();
  </script>
</body>
</html>
